[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-promo-hunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.26.0",
  "SQLAlchemy==2.0.48",
  "asyncpg==0.31.0",
  "aiosqlite==0.22.1",
  "alembic==1.18.4",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.3",
]
[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]
[tool.setuptools.packages.find]
include = ["hunter*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
